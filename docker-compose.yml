services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: erpdm
      POSTGRES_USER: erpdm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erpdm -d erpdm"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://erpdm:${POSTGRES_PASSWORD}@db:5432/erpdm
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  backup:
    image: postgres:16
    profiles: ["backup"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
      DATABASE_URL: postgresql://erpdm@db:5432/erpdm
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts:ro
    entrypoint: ["bash", "/scripts/backup.sh"]
    depends_on: [db]

volumes:
  pgdata:
