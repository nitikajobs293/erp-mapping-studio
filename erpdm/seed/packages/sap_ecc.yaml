      - {name: LAEDA, data_type: DATS, length: 8, description: Date of last change, business_name: Material Last Changed On}
      - {name: LVORM, data_type: CHAR, length: 1, description: Flag material for deletion at client level, business_name: Deletion Flag}
      - {name: MTART, data_type: CHAR, length: 4, description: Material type, business_name: Material Type}
      - {name: MATKL, data_type: CHAR, length: 9, description: Material group, business_name: Material Group}
      - {name: MEINS, data_type: UNIT, length: 3, description: Base unit of measure, business_name: Base Unit of Measure}
      - {name: BRGEW, data_type: QUAN, length: 13, decimals: 3, description: Gross weight}
      - {name: NTGEW, data_type: QUAN, length: 13, decimals: 3, description: Net weight}
      - {name: GEWEI, data_type: UNIT, length: 3, description: Weight unit}
      - {name: MFRNR, data_type: CHAR, length: 10, description: Manufacturer number, business_name: Material Manufacturer Number}
      - {name: MFRPN, data_type: CHAR, length: 40, description: Manufacturer part number, business_name: Material Manufacturer Part Number}
  - name: MAKT
    description: Material descriptions
    module: MM
    table_class: text
    business_entity: Material
    columns:
      - {name: MANDT, data_type: CLNT, length: 3, is_pk: true, description: Client}
      - {name: MATNR, data_type: CHAR, length: 18, is_pk: true, description: Material number}
      - {name: SPRAS, data_type: LANG, length: 1, is_pk: true, description: Language key}
