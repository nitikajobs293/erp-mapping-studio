      - {name: MATNR, data_type: CHAR, length: 18, is_pk: true, description: Material number}
      - {name: WERKS, data_type: CHAR, length: 4, is_pk: true, description: Plant, business_name: Material Plant}
      - {name: LVORM, data_type: CHAR, length: 1, description: Flag material for deletion at plant level}
      - {name: MMSTA, data_type: CHAR, length: 2, description: Plant-specific material status, business_name: Plant Material Status}
      - {name: EKGRP, data_type: CHAR, length: 3, description: Purchasing group, business_name: Purchasing Group}
      - {name: DISPO, data_type: CHAR, length: 3, description: MRP controller, business_name: MRP Controller}
      - {name: SERNP, data_type: CHAR, length: 4, description: Serial number profile, business_name: Serial Number Profile}
  - name: T001W
    description: Plants / branches
    module: CA
    table_class: config
    business_entity: Plant
    columns:
      - {name: MANDT, data_type: CLNT, length: 3, is_pk: true, description: Client}
      - {name: WERKS, data_type: CHAR, length: 4, is_pk: true, description: Plant, business_name: Plant Code}
      - {name: NAME1, data_type: CHAR, length: 30, description: Plant name, business_name: Plant Name}
      - {name: BWKEY, data_type: CHAR, length: 4, description: Valuation area}
      - {name: LAND1, data_type: CHAR, length: 3, description: Country key, business_name: Plant Country}
      - {name: REGIO, data_type: CHAR, length: 3, description: Region, business_name: Plant Region}
      - {name: ORT01, data_type: CHAR, length: 25, description: City, business_name: Plant City}
  # ------------------------------------------------------------------ SD / LE
  - name: KNA1
    description: General data in customer master
    module: SD
    table_class: master
    business_entity: Customer
    soft_delete_rule: "{alias}.LOEVM = 'X'"
    columns:
      - {name: MANDT, data_type: CLNT, length: 3, is_pk: true, description: Client}
      - {name: KUNNR, data_type: CHAR, length: 10, is_pk: true, description: Customer number, business_name: Customer Number}
      - {name: NAME1, data_type: CHAR, length: 35, description: Name 1, business_name: Customer Name}
      - {name: LAND1, data_type: CHAR, length: 3, description: Country key, business_name: Customer Country}
