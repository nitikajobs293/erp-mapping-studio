  - name: VBFA
    description: Sales document flow
    module: SD
    table_class: document_flow
    notes: "Preceding (VBELV/POSNV) to subsequent (VBELN/POSNN) document links. VBTYP_N = subsequent document category (e.g. J = delivery, M = invoice). In S/4HANA the key of VBFA changed — do not reuse this definition there."
    columns:
      - {name: MANDT, data_type: CLNT, length: 3, is_pk: true, description: Client}
      - {name: VBELV, data_type: CHAR, length: 10, is_pk: true, description: Preceding sales and distribution document}
      - {name: POSNV, data_type: NUMC, length: 6, is_pk: true, description: Preceding item of an SD document}
      - {name: VBELN, data_type: CHAR, length: 10, is_pk: true, description: Subsequent sales and distribution document}
      - {name: POSNN, data_type: NUMC, length: 6, is_pk: true, description: Subsequent item of an SD document}
      - {name: VBTYP_N, data_type: CHAR, length: 1, is_pk: true, description: Document category of subsequent document}
      - {name: VBTYP_V, data_type: CHAR, length: 1, description: Document category of preceding SD document}
      - {name: RFMNG, data_type: QUAN, length: 15, decimals: 3, description: Referenced quantity in base unit of measure}
      - {name: ERDAT, data_type: DATS, length: 8, description: Created on}
  # ------------------------------------------------------------------ MM purchasing / inventory
  - name: LFA1
    description: Vendor master (general section)
    module: MM
    table_class: master
    business_entity: Vendor
    soft_delete_rule: "{alias}.LOEVM = 'X'"
    columns:
