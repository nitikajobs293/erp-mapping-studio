    module: MM
    table_class: master
    business_entity: Material
    change_tracking: {columns: [LAEDA], reliable: false, note: "LAEDA is a date only and not updated for every dependent-table change. Use CDC or lookback window."}
    soft_delete_rule: "{alias}.LVORM = 'X'"
    columns:
      - {name: MANDT, data_type: CLNT, length: 3, is_pk: true, description: Client}
      - {name: MATNR, data_type: CHAR, length: 18, is_pk: true, description: Material number, business_name: Material Number}
