  - name: EKKO
    description: Purchasing document header
    module: MM
    table_class: transaction
    business_entity: Purchase Order
    columns:
      - {name: MANDT, data_type: CLNT, length: 3, is_pk: true, description: Client}
      - {name: EBELN, data_type: CHAR, length: 10, is_pk: true, description: Purchasing document number, business_name: Purchase Order Number}
      - {name: BUKRS, data_type: CHAR, length: 4, description: Company code}
      - {name: BSART, data_type: CHAR, length: 4, description: Purchasing document type, business_name: PO Type}
      - {name: LIFNR, data_type: CHAR, length: 10, description: Vendor account number}
      - {name: EKORG, data_type: CHAR, length: 4, description: Purchasing organization, business_name: Purchasing Organization}
      - {name: EKGRP, data_type: CHAR, length: 3, description: Purchasing group}
      - {name: BEDAT, data_type: DATS, length: 8, description: Purchasing document date, business_name: PO Date}
      - {name: AEDAT, data_type: DATS, length: 8, description: Record created on (EKKO-AEDAT is the creation date)}
      - {name: WAERS, data_type: CUKY, length: 5, description: Currency key}
  - name: EKPO
    description: Purchasing document item
    module: MM
    table_class: transaction
    business_entity: Purchase Order Item
    soft_delete_rule: "{alias}.LOEKZ IN ('L', 'S')"
    columns:
      - {name: MANDT, data_type: CLNT, length: 3, is_pk: true, description: Client}
      - {name: EBELN, data_type: CHAR, length: 10, is_pk: true, description: Purchasing document number}
      - {name: EBELP, data_type: NUMC, length: 5, is_pk: true, description: Item number of purchasing document, business_name: PO Item}
      - {name: LOEKZ, data_type: CHAR, length: 1, description: Deletion indicator in purchasing document}
      - {name: MATNR, data_type: CHAR, length: 18, description: Material number}
      - {name: TXZ01, data_type: CHAR, length: 40, description: Short text, business_name: PO Item Text}
      - {name: WERKS, data_type: CHAR, length: 4, description: Plant, business_name: Receiving Plant}
      - {name: LGORT, data_type: CHAR, length: 4, description: Storage location}
      - {name: MENGE, data_type: QUAN, length: 13, decimals: 3, description: Purchase order quantity, business_name: PO Quantity}
      - {name: MEINS, data_type: UNIT, length: 3, description: Purchase order unit of measure}
      - {name: NETPR, data_type: CURR, length: 11, decimals: 2, description: Net price in purchasing document, business_name: Net Price}
      - {name: AEDAT, data_type: DATS, length: 8, description: Item change date}
  - name: EKBE
    description: History per purchasing document
    module: MM
    table_class: transaction
    business_entity: PO History
    columns:
      - {name: MANDT, data_type: CLNT, length: 3, is_pk: true, description: Client}
      - {name: EBELN, data_type: CHAR, length: 10, is_pk: true, description: Purchasing document number}
      - {name: EBELP, data_type: NUMC, length: 5, is_pk: true, description: Item number of purchasing document}
      - {name: ZEKKN, data_type: NUMC, length: 2, is_pk: true, description: Sequential number of account assignment}
      - {name: VGABE, data_type: CHAR, length: 1, is_pk: true, description: Transaction/event type (1 = goods receipt, 2 = invoice receipt)}
      - {name: GJAHR, data_type: NUMC, length: 4, is_pk: true, description: Material document year}
      - {name: BELNR, data_type: CHAR, length: 10, is_pk: true, description: Number of material document}
      - {name: BUZEI, data_type: NUMC, length: 4, is_pk: true, description: Item in material document}
      - {name: BEWTP, data_type: CHAR, length: 1, description: PO history category}
      - {name: BUDAT, data_type: DATS, length: 8, description: Posting date in the document, business_name: GR Posting Date}
      - {name: MENGE, data_type: QUAN, length: 13, decimals: 3, description: Quantity, business_name: GR Quantity}
      - {name: DMBTR, data_type: CURR, length: 13, decimals: 2, description: Amount in local currency}
  - name: MKPF
    description: Header - material document
    module: MM
    table_class: transaction
    business_entity: Material Document
    change_tracking: {columns: [CPUDT, CPUTM], reliable: true, note: "Material documents are insert-only; CPUDT/CPUTM (entry date/time) is a reliable append watermark. Reversals are new documents."}
    delete_strategy: Insert-only (reversals post new documents). Append strategy is appropriate; archiving may remove old rows.
    columns:
      - {name: MANDT, data_type: CLNT, length: 3, is_pk: true, description: Client}
      - {name: MBLNR, data_type: CHAR, length: 10, is_pk: true, description: Number of material document, business_name: Material Document}
      - {name: MJAHR, data_type: NUMC, length: 4, is_pk: true, description: Material document year, business_name: Material Document Year}
      - {name: VGART, data_type: CHAR, length: 2, description: Transaction/event type}
      - {name: BLART, data_type: CHAR, length: 2, description: Document type}
      - {name: BLDAT, data_type: DATS, length: 8, description: Document date in document}
      - {name: BUDAT, data_type: DATS, length: 8, description: Posting date in the document, business_name: Posting Date}
      - {name: CPUDT, data_type: DATS, length: 8, description: Day on which accounting document was entered}
      - {name: CPUTM, data_type: TIMS, length: 6, description: Time of entry}
      - {name: USNAM, data_type: CHAR, length: 12, description: User name}
      - {name: XBLNR, data_type: CHAR, length: 16, description: Reference document number}
  - name: MSEG
    description: Document segment - material (material document items)
    module: MM
    table_class: transaction
    business_entity: Material Document Item
    delete_strategy: Insert-only via header MKPF.
    columns:
      - {name: MANDT, data_type: CLNT, length: 3, is_pk: true, description: Client}
      - {name: MBLNR, data_type: CHAR, length: 10, is_pk: true, description: Number of material document}
      - {name: MJAHR, data_type: NUMC, length: 4, is_pk: true, description: Material document year}
      - {name: ZEILE, data_type: NUMC, length: 4, is_pk: true, description: Item in material document}
      - {name: BWART, data_type: CHAR, length: 3, description: Movement type (inventory management), business_name: Movement Type}
      - {name: MATNR, data_type: CHAR, length: 18, description: Material number}
      - {name: WERKS, data_type: CHAR, length: 4, description: Plant, business_name: Movement Plant}
      - {name: LGORT, data_type: CHAR, length: 4, description: Storage location}
      - {name: CHARG, data_type: CHAR, length: 10, description: Batch number}
      - {name: SHKZG, data_type: CHAR, length: 1, description: Debit/credit indicator (S/H)}
      - {name: MENGE, data_type: QUAN, length: 13, decimals: 3, description: Quantity, business_name: Movement Quantity}
      - {name: MEINS, data_type: UNIT, length: 3, description: Base unit of measure}
      - {name: DMBTR, data_type: CURR, length: 13, decimals: 2, description: Amount in local currency, business_name: Movement Amount}
      - {name: LIFNR, data_type: CHAR, length: 10, description: Vendor account number}
      - {name: KUNNR, data_type: CHAR, length: 10, description: Account number of customer}
      - {name: EBELN, data_type: CHAR, length: 10, description: Purchase order number}
      - {name: EBELP, data_type: NUMC, length: 5, description: Item number of purchasing document}
relationships:
  # -------------------------------------------------------------- equipment
  - {from_table: EQUI, to_table: EQKT, join_columns: [{from: MANDT, to: MANDT}, {from: EQUNR, to: EQUNR}], extra_condition: "{to}.SPRAS = '{lang}'", join_type: LEFT, cardinality: "1:N", relationship_type: text, description: Equipment short text per language, business_purpose: Adds the equipment description in the reporting language, confidence: 0.92}
  - {from_table: EQUI, to_table: EQUZ, join_columns: [{from: MANDT, to: MANDT}, {from: EQUNR, to: EQUNR}], extra_condition: "{to}.DATBI = '99991231'", join_type: LEFT, cardinality: "1:N", relationship_type: master_detail, description: Time segments of equipment; current segment has DATBI = 99991231, business_purpose: Current planning plant / location assignment / superior equipment, confidence: 0.9}
  - {from_table: EQUZ, to_table: ILOA, join_columns: [{from: MANDT, to: MANDT}, {from: ILOAN, to: ILOAN}], join_type: LEFT, cardinality: "N:1", relationship_type: lookup, description: Location and account assignment of the equipment time segment, business_purpose: Maintenance plant, location, functional location, cost center, confidence: 0.9}
  - {from_table: EQUI, to_table: EQBS, join_columns: [{from: MANDT, to: MANDT}, {from: EQUNR, to: EQUNR}], join_type: LEFT, cardinality: "1:1", relationship_type: one_to_one, description: Stock segment of a serialised equipment (exists only while the serial number is in stock), business_purpose: Current stock plant / storage location / batch for serial number lists (IQ09), confidence: 0.88}
