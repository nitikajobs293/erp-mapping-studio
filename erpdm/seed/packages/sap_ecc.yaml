# SAP ECC 6.0 — standard (non-customised) data dictionary knowledge.
# Provenance: standard_erp_knowledge. Everything here is GENERIC SAP knowledge and must be validated
# against your own system's DDIC (DD02L/DD03L/DD05S extracts) before being treated as verified.
erp:
  code: SAP_ECC
  name: SAP ECC 6.0
  vendor: SAP
  version_label: ECC 6.0 (EHP7/8)
  category: ERP
  description: SAP ERP Central Component. Reference catalogue of standard tables (customer-specific Z-tables not included).
  extraction_method: SAP ODP / SLT replication or SAP Data Services / Fivetran / Qlik Replicate into Snowflake RAW
  default_language_key: E
  has_client_column: true
  client_column: MANDT
defaults:
  source_type: standard_erp_knowledge
  confidence: 0.85
  validation_status: requires_validation
  source_reference: SAP standard data dictionary (SE11) — generic knowledge, not read from your system
modules:
  - {code: PM, name: Plant Maintenance}
  - {code: MM, name: Materials Management}
  - {code: SD, name: Sales and Distribution}
  - {code: LE, name: Logistics Execution}
  - {code: CA, name: Cross-Application}
processes:
  - name: Equipment and Serial Number Management
    domain: Equipment Management
    module: PM
    sub_process: Serialised equipment master maintenance
    description: Equipment master records are created for serialised materials (material + serial number) and for maintainable technical objects.
    flow_steps: [Material master with serial number profile, Goods movement assigns serial number, Equipment record created/updated (EQUI), Time-dependent installation/location data (EQUZ/ILOA), Stock segment updated (EQBS), Status maintained (JEST)]
  - name: Order to Delivery
    domain: Sales and Distribution
    module: SD
    sub_process: Sales order fulfilment
    description: Sales order is created, referenced by an outbound delivery, picked and goods-issued.
    flow_steps: [Sales order header (VBAK), Sales order items (VBAP), Outbound delivery header (LIKP), Delivery items (LIPS) referencing order items, Document flow recorded (VBFA), Goods issue]
  - name: Procure to Pay — Purchase Order to Goods Receipt
    domain: Procurement
    module: MM
    sub_process: Purchase order and receipt
    description: Purchase order raised to a vendor and received via goods receipt (material document).
    flow_steps: [Purchase order header (EKKO), Purchase order items (EKPO), Goods receipt material document (MKPF/MSEG), PO history updated (EKBE), Invoice receipt]
  - name: Inventory Movements
    domain: Inventory Management
    module: MM
    sub_process: Goods movements
    description: Every goods movement posts a material document (header MKPF, items MSEG).
    flow_steps: [Goods movement posted, Material document header (MKPF), Material document items (MSEG), Stock tables updated]
tables:
  # ------------------------------------------------------------------ PM / equipment
  - name: EQUI
    description: Equipment master data
    module: PM
    table_class: master
    business_entity: Equipment
    change_tracking: {columns: [AEDAT], reliable: false, note: "AEDAT is a change DATE (no time) and is not updated by every change (e.g. status-only changes live in JEST; time-dependent data in EQUZ). Use it with a lookback window or prefer log-based CDC (SLT/ODP)."}
    delete_strategy: Physical deletes are rare (archiving, object PM_EQUI). Logical deletion via status DLFL (I0076) in JEST. Use CDC delete markers or periodic full-key reconciliation.
    soft_delete_rule: "EXISTS (SELECT 1 FROM JEST j WHERE j.MANDT = {alias}.MANDT AND j.OBJNR = {alias}.OBJNR AND j.STAT = 'I0076' AND j.INACT = '')"
    columns:
      - {name: MANDT, data_type: CLNT, length: 3, is_pk: true, description: Client}
      - {name: EQUNR, data_type: CHAR, length: 18, is_pk: true, description: Equipment number, business_name: Equipment Number}
      - {name: ERDAT, data_type: DATS, length: 8, description: Date on which the record was created, business_name: Created On}
      - {name: ERNAM, data_type: CHAR, length: 12, description: Name of person who created the object, business_name: Created By}
      - {name: AEDAT, data_type: DATS, length: 8, description: Last changed on, business_name: Last Changed On}
      - {name: AENAM, data_type: CHAR, length: 12, description: Name of person who changed object, business_name: Changed By}
      - {name: EQTYP, data_type: CHAR, length: 1, description: Equipment category, business_name: Equipment Category, check_table: T370T}
      - {name: EQART, data_type: CHAR, length: 10, description: Type of technical object, business_name: Object Type}
      - {name: INVNR, data_type: CHAR, length: 25, description: Inventory number, business_name: Inventory Number}
      - {name: GROES, data_type: CHAR, length: 18, description: Size/dimension, business_name: Size Dimension}
      - {name: BRGEW, data_type: QUAN, length: 13, decimals: 3, description: Gross weight, business_name: Gross Weight}
      - {name: GEWEI, data_type: UNIT, length: 3, description: Weight unit, business_name: Weight Unit}
      - {name: ANSDT, data_type: DATS, length: 8, description: Acquisition date, business_name: Acquisition Date}
      - {name: ANSWT, data_type: CURR, length: 13, decimals: 2, description: Acquisition value, business_name: Acquisition Value}
      - {name: WAERS, data_type: CUKY, length: 5, description: Currency key, business_name: Currency}
      - {name: HERST, data_type: CHAR, length: 30, description: Manufacturer of asset, business_name: Manufacturer}
      - {name: HERLD, data_type: CHAR, length: 3, description: Country of manufacture, business_name: Country of Manufacture}
      - {name: BAUJJ, data_type: CHAR, length: 4, description: Year of construction, business_name: Construction Year}
      - {name: BAUMM, data_type: CHAR, length: 2, description: Month of construction, business_name: Construction Month}
      - {name: TYPBZ, data_type: CHAR, length: 20, description: Manufacturer model number, business_name: Model Number}
      - {name: SERGE, data_type: CHAR, length: 30, description: Manufacturer serial number, business_name: Manufacturer Serial Number}
      - {name: MAPAR, data_type: CHAR, length: 30, description: Manufacturer part number, business_name: Manufacturer Part Number}
      - {name: MATNR, data_type: CHAR, length: 18, description: Material number (serialised material), business_name: Material Number}
      - {name: SERNR, data_type: CHAR, length: 18, description: Serial number, business_name: Serial Number}
      - {name: INBDT, data_type: DATS, length: 8, description: Start-up date of the technical object, business_name: Start-up Date}
      - {name: OBJNR, data_type: CHAR, length: 22, description: Object number (status / CO link), business_name: Object Number}
  - name: EQKT
    description: Equipment short texts (language dependent)
    module: PM
    table_class: text
    business_entity: Equipment
    columns:
      - {name: MANDT, data_type: CLNT, length: 3, is_pk: true, description: Client}
      - {name: EQUNR, data_type: CHAR, length: 18, is_pk: true, description: Equipment number}
      - {name: SPRAS, data_type: LANG, length: 1, is_pk: true, description: Language key}
      - {name: EQKTX, data_type: CHAR, length: 40, description: Description of technical object, business_name: Equipment Description}
      - {name: KZLTX, data_type: CHAR, length: 1, description: Indicator - long text exists}
  - name: EQUZ
    description: Equipment time segment (time-dependent installation and planning data)
    module: PM
    table_class: master
    business_entity: Equipment
    default_filter: "{alias}.DATBI = '99991231'"
    notes: Time-dependent. The current segment has DATBI = '99991231'. Historical segments are needed for SCD Type 2 rebuilds.
    columns:
      - {name: MANDT, data_type: CLNT, length: 3, is_pk: true, description: Client}
      - {name: EQUNR, data_type: CHAR, length: 18, is_pk: true, description: Equipment number}
      - {name: DATBI, data_type: DATS, length: 8, is_pk: true, description: Valid-to date, business_name: Valid To}
      - {name: EQLFN, data_type: NUMC, length: 3, is_pk: true, description: Consecutive number of equipment usage period}
      - {name: ERDAT, data_type: DATS, length: 8, description: Date on which the record was created}
      - {name: AEDAT, data_type: DATS, length: 8, description: Last changed on}
      - {name: IWERK, data_type: CHAR, length: 4, description: Maintenance planning plant, business_name: Planning Plant, check_table: T001W}
      - {name: INGRP, data_type: CHAR, length: 3, description: Maintenance planner group, business_name: Planner Group}
      - {name: TIDNR, data_type: CHAR, length: 25, description: Technical identification number, business_name: Technical Identification Number}
      - {name: HEQUI, data_type: CHAR, length: 18, description: Superordinate equipment, business_name: Superior Equipment}
      - {name: ILOAN, data_type: CHAR, length: 12, description: Location and account assignment for technical object}
  - name: ILOA
    description: PM object location and account assignment
    module: PM
    table_class: master
    business_entity: Equipment
    columns:
      - {name: MANDT, data_type: CLNT, length: 3, is_pk: true, description: Client}
      - {name: ILOAN, data_type: CHAR, length: 12, is_pk: true, description: Location and account assignment for technical object}
      - {name: TPLNR, data_type: CHAR, length: 30, description: Functional location, business_name: Functional Location}
      - {name: SWERK, data_type: CHAR, length: 4, description: Maintenance plant, business_name: Maintenance Plant, check_table: T001W}
      - {name: STORT, data_type: CHAR, length: 10, description: Location of maintenance object, business_name: Location}
      - {name: MSGRP, data_type: CHAR, length: 8, description: Room, business_name: Room}
      - {name: BEBER, data_type: CHAR, length: 3, description: Plant section, business_name: Plant Section}
      - {name: ABCKZ, data_type: CHAR, length: 1, description: ABC indicator for technical object, business_name: ABC Indicator}
      - {name: EQFNR, data_type: CHAR, length: 30, description: Sort field, business_name: Sort Field}
      - {name: BUKRS, data_type: CHAR, length: 4, description: Company code, business_name: Company Code}
      - {name: KOSTL, data_type: CHAR, length: 10, description: Cost center, business_name: Cost Center}
      - {name: ANLNR, data_type: CHAR, length: 12, description: Main asset number, business_name: Asset Number}
  - name: EQBS
    description: Serial number stock segment (current stock location of serialised equipment)
    module: PM
    table_class: master
    business_entity: Equipment
    columns:
      - {name: MANDT, data_type: CLNT, length: 3, is_pk: true, description: Client}
      - {name: EQUNR, data_type: CHAR, length: 18, is_pk: true, description: Equipment number}
      - {name: B_WERK, data_type: CHAR, length: 4, description: Plant (stock), business_name: Plant, check_table: T001W}
      - {name: B_LAGER, data_type: CHAR, length: 4, description: Storage location, business_name: Storage Location}
      - {name: B_CHARGE, data_type: CHAR, length: 10, description: Batch number, business_name: Batch}
      - {name: LBBSA, data_type: CHAR, length: 2, description: Stock type of goods movement, business_name: Stock Type}
      - {name: SOBKZ, data_type: CHAR, length: 1, description: Special stock indicator, business_name: Special Stock Indicator}
      - {name: KUNNR, data_type: CHAR, length: 10, description: Customer (special stock), business_name: Customer Number}
      - {name: LIFNR, data_type: CHAR, length: 10, description: Vendor (special stock), business_name: Vendor Number}
  - name: T370T
    description: Equipment category texts
    module: PM
    table_class: config
    confidence: 0.75
    columns:
      - {name: MANDT, data_type: CLNT, length: 3, is_pk: true, description: Client}
      - {name: SPRAS, data_type: LANG, length: 1, is_pk: true, description: Language key}
      - {name: EQTYP, data_type: CHAR, length: 1, is_pk: true, description: Equipment category}
      - {name: TYPTX, data_type: CHAR, length: 20, description: Equipment category text, business_name: Equipment Category Description}
  - name: JEST
    description: Individual object status
    module: CA
    table_class: status
    columns:
      - {name: MANDT, data_type: CLNT, length: 3, is_pk: true, description: Client}
      - {name: OBJNR, data_type: CHAR, length: 22, is_pk: true, description: Object number}
      - {name: STAT, data_type: CHAR, length: 5, is_pk: true, description: Object status (I* = system, E* = user)}
      - {name: INACT, data_type: CHAR, length: 1, description: Indicator - status is inactive}
      - {name: CHGNR, data_type: NUMC, length: 3, description: Change number}
  - name: TJ02T
    description: System status texts (client-independent)
    module: CA
    table_class: config
    columns:
      - {name: ISTAT, data_type: CHAR, length: 5, is_pk: true, description: System status}
      - {name: SPRAS, data_type: LANG, length: 1, is_pk: true, description: Language key}
      - {name: TXT04, data_type: CHAR, length: 4, description: Status short text, business_name: System Status}
      - {name: TXT30, data_type: CHAR, length: 30, description: Status description, business_name: System Status Description}
  # ------------------------------------------------------------------ MM master
  - name: MARA
