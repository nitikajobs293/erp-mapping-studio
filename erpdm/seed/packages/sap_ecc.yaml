      - {name: VTWEG, data_type: CHAR, length: 2, description: Distribution channel, business_name: Distribution Channel}
      - {name: SPART, data_type: CHAR, length: 2, description: Division, business_name: Division}
      - {name: KUNNR, data_type: CHAR, length: 10, description: Sold-to party, business_name: Sold-to Customer}
