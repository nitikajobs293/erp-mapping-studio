  - {from_table: EQUZ, to_table: T001W, join_columns: [{from: MANDT, to: MANDT}, {from: IWERK, to: WERKS}], join_type: LEFT, cardinality: "N:1", relationship_type: lookup, description: Maintenance planning plant, business_purpose: Plant name of planning plant, confidence: 0.85}
