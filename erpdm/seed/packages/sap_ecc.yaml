  - name: LIPS
    description: SD document - delivery item data
    module: LE
    table_class: transaction
    business_entity: Delivery Item
    columns:
      - {name: MANDT, data_type: CLNT, length: 3, is_pk: true, description: Client}
      - {name: VBELN, data_type: CHAR, length: 10, is_pk: true, description: Delivery}
