transactions:
  - code: IQ09
    name: Display Material Serial Numbers (list)
    module: PM
    process: Equipment and Serial Number Management
    transaction_type: tcode
    business_object: Serial number (equipment record with material + serial number)
    description: Multi-selection list of material serial numbers. Each serial number is stored as an equipment master record (EQUI with MATNR + SERNR); stock location comes from the serial number stock segment (EQBS).
    business_purpose: Find where serialised items are, which material they belong to, their category, manufacturer and status.
    business_logic: "A serial number = EQUI row with MATNR and SERNR populated. Current stock location = EQBS (absent once the item leaves stock). Descriptions come from EQKT (equipment) and MAKT (material) in the logon language. Current installation/location data = EQUZ row with DATBI = '99991231' plus ILOA. Deletion/inactive state = JEST system statuses I0076 (DLFL) / I0320 (INAC)."
    app_components: {note: "List report on equipment/serial number master. Report program name and any CDS views must be confirmed in SE93 / SE11 on your system — not asserted here.", business_object: "EQUI (equipment) / serial number"}
    root_table: EQUI
    default_columns: [EQUI.EQUNR, EQUI.SERNR, EQUI.MATNR, MAKT.MAKTX, EQBS.B_WERK, T001W.NAME1, EQBS.B_LAGER, EQUI.EQTYP, T370T.TYPTX, EQUI.HERST, EQUI.TYPBZ, EQKT.EQKTX, EQUI.ERDAT, EQUI.AEDAT]
    tables:
      - {table: EQUI, role: primary}
      - {table: EQKT, role: text}
      - {table: EQBS, role: secondary, notes: Stock segment for serial numbers in stock}
      - {table: MARA, role: lookup}
      - {table: MAKT, role: text}
      - {table: T370T, role: text}
      - {table: T001W, role: lookup}
      - {table: EQUZ, role: secondary, notes: Optional - installation / planning data}
      - {table: ILOA, role: secondary, notes: Optional - location / maintenance plant}
      - {table: JEST, role: status, notes: Status - aggregate, do not join row-level}
  - code: IQ03
    name: Display Material Serial Number
    module: PM
    process: Equipment and Serial Number Management
    business_object: Serial number
    description: Single serial number display (material + serial number).
    business_purpose: Inspect one serialised item.
    root_table: EQUI
    default_columns: [EQUI.EQUNR, EQUI.SERNR, EQUI.MATNR, MAKT.MAKTX, EQBS.B_WERK, EQBS.B_LAGER]
    tables: [{table: EQUI, role: primary}, {table: EQBS, role: secondary}, {table: MARA, role: lookup}, {table: MAKT, role: text}]
  - code: IE03
    name: Display Equipment
    module: PM
    process: Equipment and Serial Number Management
    business_object: Equipment
    description: Display a single equipment master record including general, location, organisation and structure data.
    business_purpose: Inspect equipment master data.
    business_logic: General data from EQUI/EQKT; time-dependent structure & planning from current EQUZ segment; location & account assignment from ILOA.
    root_table: EQUI
    default_columns: [EQUI.EQUNR, EQKT.EQKTX, EQUI.EQTYP, EQUI.EQART, EQUI.HERST, EQUI.TYPBZ, EQUI.SERGE, EQUZ.IWERK, EQUZ.HEQUI, ILOA.SWERK, ILOA.STORT, ILOA.TPLNR, ILOA.KOSTL]
    tables: [{table: EQUI, role: primary}, {table: EQKT, role: text}, {table: EQUZ, role: secondary}, {table: ILOA, role: secondary}, {table: T001W, role: lookup}, {table: JEST, role: status}]
  - code: IH08
    name: Display Equipment (list)
    module: PM
    process: Equipment and Serial Number Management
    business_object: Equipment
    description: Multi-level equipment list with selection on location, organisation and structure.
    root_table: EQUI
    default_columns: [EQUI.EQUNR, EQKT.EQKTX, EQUI.EQTYP, EQUZ.IWERK, ILOA.SWERK, ILOA.STORT, ILOA.TPLNR]
    tables: [{table: EQUI, role: primary}, {table: EQKT, role: text}, {table: EQUZ, role: secondary}, {table: ILOA, role: secondary}]
  - code: MM03
    name: Display Material
    module: MM
    business_object: Material
    description: Display material master views.
    root_table: MARA
    default_columns: [MARA.MATNR, MAKT.MAKTX, MARA.MTART, MARA.MATKL, MARA.MEINS, MARC.WERKS, MARC.DISPO]
    tables: [{table: MARA, role: primary}, {table: MAKT, role: text}, {table: MARC, role: secondary}, {table: T001W, role: lookup}]
  - code: VA03
    name: Display Sales Order
    module: SD
    process: Order to Delivery
    business_object: Sales order
    description: Display a sales document (header, items, partners, document flow).
    root_table: VBAP
    default_columns: [VBAK.VBELN, VBAP.POSNR, VBAK.AUART, VBAK.ERDAT, VBAK.KUNNR, KNA1.NAME1, VBAP.MATNR, VBAP.ARKTX, VBAP.KWMENG, VBAP.NETWR, VBAK.WAERK]
    tables: [{table: VBAK, role: primary}, {table: VBAP, role: secondary}, {table: KNA1, role: lookup}, {table: VBFA, role: secondary}]
  - code: VL03N
    name: Display Outbound Delivery
    module: LE
    process: Order to Delivery
    business_object: Outbound delivery
    description: Display delivery header and items, with reference to the preceding sales order.
    root_table: LIPS
    default_columns: [LIKP.VBELN, LIPS.POSNR, LIKP.LFART, LIKP.KUNNR, LIKP.WADAT_IST, LIPS.MATNR, LIPS.LFIMG, LIPS.WERKS, LIPS.VGBEL, LIPS.VGPOS]
    tables: [{table: LIKP, role: primary}, {table: LIPS, role: secondary}, {table: VBAP, role: lookup}, {table: KNA1, role: lookup}]
  - code: ME23N
    name: Display Purchase Order
    module: MM
    process: Procure to Pay — Purchase Order to Goods Receipt
    business_object: Purchase order
    description: Display purchase order header, items and PO history.
    root_table: EKPO
    default_columns: [EKKO.EBELN, EKPO.EBELP, EKKO.BSART, EKKO.BEDAT, EKKO.LIFNR, LFA1.NAME1, EKPO.MATNR, EKPO.TXZ01, EKPO.MENGE, EKPO.NETPR, EKPO.WERKS]
    tables: [{table: EKKO, role: primary}, {table: EKPO, role: secondary}, {table: LFA1, role: lookup}, {table: EKBE, role: secondary}]
  - code: MB51
    name: Material Document List
    module: MM
    process: Inventory Movements
    business_object: Material document
    description: List of material documents (goods movements) by material, plant, movement type.
    root_table: MSEG
    default_columns: [MKPF.MBLNR, MKPF.MJAHR, MSEG.ZEILE, MKPF.BUDAT, MSEG.BWART, MSEG.MATNR, MAKT.MAKTX, MSEG.WERKS, MSEG.LGORT, MSEG.MENGE, MSEG.MEINS, MSEG.DMBTR]
    tables: [{table: MKPF, role: primary}, {table: MSEG, role: secondary}, {table: MARA, role: lookup}, {table: MAKT, role: text}]
terms:
  - {term: Equipment Number, synonyms: [equipment id, equipment, equnr, equipment no], table: EQUI, column: EQUNR, definition: Unique identifier of an equipment (technical object) master record}
  - {term: Serial Number, synonyms: [serial no, serial, sernr, s/n], table: EQUI, column: SERNR, definition: Serial number of a serialised material; together with MATNR identifies one physical item}
  - {term: Manufacturer, synonyms: [manufacturer name, make, oem, herst], table: EQUI, column: HERST, definition: Manufacturer of the asset as entered on the equipment}
  - {term: Equipment Category, synonyms: [equipment type code, eqtyp], table: EQUI, column: EQTYP, definition: Equipment category key controlling equipment behaviour}
  - {term: Equipment Category Description, synonyms: [equipment category text], table: T370T, column: TYPTX, lookup_logic: "T370T on EQTYP + SPRAS"}
  - {term: Equipment Description, synonyms: [equipment text, equipment name], table: EQKT, column: EQKTX, lookup_logic: "EQKT on EQUNR + SPRAS"}
  - {term: Material Description, synonyms: [material text, material name, product description], table: MAKT, column: MAKTX, lookup_logic: "MAKT on MATNR + SPRAS"}
  - {term: Storage Location, synonyms: [sloc, storage loc], table: EQBS, column: B_LAGER}
  - {term: Model Number, synonyms: [model, typbz], table: EQUI, column: TYPBZ}
  - {term: Functional Location, synonyms: [floc, tplnr], table: ILOA, column: TPLNR}
  - {term: Location, synonyms: [equipment location, stort], table: ILOA, column: STORT}
  - {term: Maintenance Plant, synonyms: [mplant], table: ILOA, column: SWERK}
  - {term: Plant Name, synonyms: [plant description], table: T001W, column: NAME1}
  - {term: Customer Name, synonyms: [sold to name], table: KNA1, column: NAME1}
  - {term: Vendor Name, synonyms: [supplier name], table: LFA1, column: NAME1}
  - {term: Sales Order Number, synonyms: [sales order, so number, order number], table: VBAK, column: VBELN}
  - {term: Delivery Number, synonyms: [outbound delivery, delivery], table: LIKP, column: VBELN}
  - {term: Purchase Order Number, synonyms: [po number, po], table: EKKO, column: EBELN}
use_cases:
  - name: Equipment Master Data Model
    domain: Equipment Management
    description: Equipment details with serial number, material, plant, location, category, manufacturer and maintenance assignment.
    keywords: [equipment, serial, serial number, manufacturer, equipment category, maintenance, location, plant, material, asset]
    tables: [EQUI, EQKT, MARA, MAKT, T370T, EQBS]
    optional_tables: [EQUZ, ILOA, T001W]
    root_table: EQUI
    grain: One row per equipment (EQUNR)
  - name: Sales Order to Delivery
    domain: Sales and Distribution
    description: Sales order items with their outbound deliveries.
    keywords: [sales order, order, delivery, shipment, customer, fulfilment, outbound]
    tables: [VBAK, VBAP, LIPS, LIKP, KNA1]
    optional_tables: [MARA, MAKT]
    root_table: VBAP
    grain: One row per sales order item and delivery item
  - name: Purchase Order to Goods Receipt
    domain: Procurement
    description: Purchase order items with goods receipt history and vendor.
    keywords: [purchase order, po, procurement, goods receipt, vendor, supplier, receiving]
    tables: [EKKO, EKPO, LFA1, EKBE]
    optional_tables: [MARA, MAKT, T001W]
    root_table: EKPO
    grain: One row per PO item and PO history record
  - name: Inventory Movements
    domain: Inventory Management
    description: Goods movements by material, plant and movement type.
    keywords: [inventory, goods movement, material document, stock, movement type]
    tables: [MKPF, MSEG, MARA, MAKT]
    optional_tables: [T001W]
    root_table: MSEG
    grain: One row per material document item
