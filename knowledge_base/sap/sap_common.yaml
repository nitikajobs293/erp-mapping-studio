concepts:
  sales_order_number:   {table: VBAK, field: VBELN, confidence: standard}
  sales_order_item:     {table: VBAP, field: POSNR, confidence: standard}
  sales_order_type:     {table: VBAK, field: AUART, confidence: standard}
  order_date:           {table: VBAK, field: AUDAT, confidence: standard, note: "ERDAT = system creation date; AUDAT = document date entered by user"}
  customer:             {table: VBAK, field: KUNNR, confidence: standard}
  customer_name:        {table: KNA1, field: NAME1, confidence: standard}
  ship_to:              {table: VBPA, field: KUNNR, confidence: standard, note: "Partner function WE at header (POSNR '000000'); item-level ship-to overrides possible"}
  sales_org:            {table: VBAK, field: VKORG, confidence: standard}
  distribution_channel: {table: VBAK, field: VTWEG, confidence: standard}
  division:             {table: VBAK, field: SPART, confidence: standard, note: "Header division; item division VBAP-SPART can differ"}
  material:             {table: VBAP, field: MATNR, confidence: standard}
  material_description: {table: MAKT, field: MAKTX, confidence: standard}
  order_quantity:       {table: VBAP, field: KWMENG, confidence: standard}
  confirmed_quantity:   {expr: "{SO_CONFIRMED_QTY.CONFIRMED_QTY}", confidence: inferred, note: "Sum of VBEP-BMENG per item"}
  open_quantity:        {expr: "GREATEST({VBAP.KWMENG} - COALESCE({SO_DELIVERED_QTY.DELIVERED_QTY}, 0), 0)", confidence: inferred, note: "Order qty minus delivered qty; set to 0 when item is rejected (ABGRU) in gold layer"}
  sales_uom:            {table: VBAP, field: VRKME, confidence: standard}
  requested_delivery_date: {table: VBAK, field: VDATU, confidence: standard, alternatives: ["VBEP-EDATU of first schedule line (ETENR = '0001')"]}
  rejection_reason:     {table: VBAP, field: ABGRU, confidence: standard, alternatives: ["TVAGT-BEZEI for text"]}
  net_value:            {table: VBAP, field: NETWR, confidence: standard}
  currency:             {table: VBAK, field: WAERK, confidence: standard}
  delivery_number:      {table: LIKP, field: VBELN, confidence: standard}
  delivery_item:        {table: LIPS, field: POSNR, confidence: standard}
  delivery_type:        {table: LIKP, field: LFART, confidence: standard}
  delivery_quantity:    {table: LIPS, field: LFIMG, confidence: standard}
  shipped_quantity:     {table: LIPS, field: LFIMG, confidence: inferred, note: "Shipped = delivered quantity once goods issue is posted (WBSTA = 'C')"}
  plant:                {table: LIPS, field: WERKS, confidence: standard}
  storage_location:     {table: LIPS, field: LGORT, confidence: standard}
  warehouse:            {table: LIKP, field: LGNUM, confidence: standard, note: "WM/EWM warehouse number"}
  shipping_point:       {table: LIKP, field: VSTEL, confidence: standard}
  planned_delivery_date: {table: LIKP, field: LFDAT, confidence: standard}
  planned_goods_issue_date: {table: LIKP, field: WADAT, confidence: standard}
  actual_goods_issue_date: {table: LIKP, field: WADAT_IST, confidence: standard}
  route:                {table: LIKP, field: ROUTE, confidence: standard}
  shipment_number:      {table: VTTK, field: TKNUM, confidence: standard}
  shipment_type:        {table: VTTK, field: SHTYP, confidence: standard}
  shipment_date:        {table: VTTK, field: DATBG, confidence: inferred, note: "Actual shipment start; use DPTBG for planned"}
  carrier:              {table: VTTK, field: TDLNR, confidence: standard, alternatives: ["VBPA partner function SP on delivery", "LFA1-NAME1 for carrier name"]}
  transport_mode:       {table: VTTK, field: VSART, confidence: standard}
  shipment_status:      {table: VTTK, field: STTRG, confidence: standard}
  departure_date:       {table: VTTK, field: DATBG, confidence: standard}
  arrival_date:         {table: VTTK, field: DATEN, confidence: inferred, note: "Actual shipment completion date - usually the closest standard field to arrival"}
  actual_delivery_date: {table: VTTK, field: DATEN, confidence: validate, note: "No standard POD date on VTTK. If POD is used, check LIKP-PODAT / table TVPOD, or carrier event integration"}
  tracking_number:      {table: VTTK, field: EXTI1, confidence: inferred, note: "Customer-specific usage of EXTI1/EXTI2/SIGNI - validate"}
  origin:               {table: VTTS, field: VSTEL, confidence: inferred, note: "Departure shipping point of the leg; alternative WERKA (plant)"}
  destination:          {table: VTTS, field: KUNNA, confidence: inferred, note: "Destination customer of the leg; alternatives VSTEZ / WERKZ"}
  freight_cost:         {table: VFKP, field: NETWR, confidence: validate, note: "Requires shipment cost documents to be in use"}
  handling_unit:        {table: VEKP, field: EXIDV, confidence: standard}
  invoice_number:       {table: VBRK, field: VBELN, confidence: standard}
  invoice_date:         {table: VBRK, field: FKDAT, confidence: standard}
  batch:                {table: LIPS, field: CHARG, confidence: standard}
  serial_number:        {table: EQUI, field: SERNR, confidence: standard, alternatives: ["OBJK-SERNR via SER01 for delivery-level serials"]}
  stock_unrestricted:   {table: MARD, field: LABST, confidence: standard}
  stock_blocked:        {table: MARD, field: SPEME, confidence: standard}
  stock_quality:        {table: MARD, field: INSME, confidence: standard}
  stock_available:      {expr: "{MARD.LABST}", confidence: validate, note: "True availability (ATP) is not stored - needs reservations/sales requirements logic or MD04/ATP APIs"}
  purchase_order:       {table: EKKO, field: EBELN, confidence: standard}
  purchase_order_item:  {table: EKPO, field: EBELP, confidence: standard}
  supplier:             {table: EKKO, field: LIFNR, confidence: standard}
  gr_quantity:          {table: EKBE, field: MENGE, confidence: standard, note: "Filter VGABE = '1'; SHKZG = 'H' rows are reversals - sign them negative"}
  gr_date:              {table: EKBE, field: BUDAT, confidence: standard}
  production_order:     {table: AFKO, field: AUFNR, confidence: standard}
  production_quantity:  {table: AFKO, field: GAMNG, confidence: standard}
  production_completed_qty: {table: AFPO, field: WEMNG, confidence: standard}
  component_quantity:   {table: RESB, field: BDMNG, confidence: standard, alternatives: ["RESB-ENMNG for withdrawn quantity"]}

business_objects:
  sales_order:
    anchor: VBAP
    header: VBAK
    grain: One row per sales order item (VBAK-VBELN + VBAP-POSNR)
    model_type: Header/item transaction fact (accumulating snapshot for fulfilment KPIs)
    business_key: [VBELN, POSNR]
    tables: [VBAK, VBAP, VBEP, VBPA, KNA1, MAKT, TVAGT]
    duplicate_risks:
      - "Joining VBEP directly multiplies rows by schedule lines - aggregate first (SO_CONFIRMED_QTY)."
      - "VBPA must be filtered by PARVW and POSNR or each partner creates a row."
      - "MAKT / TVAGT must be filtered by SPRAS."
      - "Joining deliveries (LIPS) changes grain to delivery item - aggregate (SO_DELIVERED_QTY) to stay at order item grain."
  delivery:
    anchor: LIPS
    header: LIKP
    grain: One row per delivery item (LIKP-VBELN + LIPS-POSNR)
    model_type: Header/item transaction fact
    business_key: [VBELN, POSNR]
    tables: [LIKP, LIPS, VBAP, VBAK, KNA1, MAKT]
    field_overrides:
      material: {table: LIPS, field: MATNR}
      sales_order_number: {table: LIPS, field: VGBEL, note: "Reference document - valid when VGTYP = 'C' (order)"}
      sales_order_item: {table: LIPS, field: VGPOS}
      customer: {table: LIKP, field: KUNAG}
      ship_to: {table: LIKP, field: KUNNR}
      sales_org: {table: LIKP, field: VKORG}
    duplicate_risks:
      - "Batch split: main item + sub-items (UECHA <> '000000') can double-count quantity - choose main or sub items consistently."
      - "A delivery assigned to multiple shipments (multi-leg) duplicates rows when joining VTTP."
  shipment:
    anchor: VTTP
    header: VTTK
    grain: One row per shipment-delivery assignment (VTTP-TKNUM + TPNUM); join LIPS to go to delivery-item grain
    model_type: Bridge + accumulating snapshot (shipment milestones)
    business_key: [TKNUM, TPNUM]
    tables: [VTTK, VTTP, LIKP, LIPS, VTTS, LFA1, VFKP]
    field_overrides:
      material: {table: LIPS, field: MATNR}
      shipped_quantity: {table: LIPS, field: LFIMG}
      sales_order_number: {table: LIPS, field: VGBEL}
      sales_order_item: {table: LIPS, field: VGPOS}
      customer: {table: LIKP, field: KUNAG}
      ship_to: {table: LIKP, field: KUNNR}
      plant: {table: LIPS, field: WERKS}
    duplicate_risks:
      - "VTTS (stages) is 1:N to the shipment - joining it fans out deliveries per leg. Pick the main leg or aggregate."
      - "VFKP (freight costs) is 1:N - aggregate costs per shipment before joining, or allocate cost to deliveries."
      - "Joining LIPS changes grain to delivery item."
  billing:
    anchor: VBRP
    header: VBRK
    grain: One row per billing item
    model_type: Header/item transaction fact
    business_key: [VBELN, POSNR]
    tables: [VBRK, VBRP]
    field_overrides:
      material: {table: VBRP, field: MATNR}
      delivery_number: {table: VBRP, field: VGBEL}
      sales_order_number: {table: VBRP, field: AUBEL}
      sales_order_item: {table: VBRP, field: AUPOS}
      net_value: {table: VBRP, field: NETWR}
      customer: {table: VBRK, field: KUNAG}
    duplicate_risks: ["Cancelled invoices (FKSTO = 'X') and their cancellation documents both exist - exclude or net them."]
  inventory:
    anchor: MARD
    grain: One row per material / plant / storage location (current snapshot)
    model_type: Periodic snapshot fact (take daily snapshots in Snowflake for history)
    business_key: [MATNR, WERKS, LGORT]
    tables: [MARD, MARA, MAKT, T001W, T001L, MCHB]
    field_overrides:
      material: {table: MARD, field: MATNR}
      plant: {table: MARD, field: WERKS}
      storage_location: {table: MARD, field: LGORT}
      batch: {table: MCHB, field: CHARG}
    duplicate_risks: ["Joining MCHB changes grain to batch - use MCHB quantities instead of MARD when batch is required."]
  purchase_order:
    anchor: EKPO
    header: EKKO
    grain: One row per purchase order item
    model_type: Header/item transaction fact
    business_key: [EBELN, EBELP]
    tables: [EKKO, EKPO, EKET, EKBE, LFA1]
    field_overrides:
      material: {table: EKPO, field: MATNR}
      plant: {table: EKPO, field: WERKS}
      order_quantity: {table: EKPO, field: MENGE}
      net_value: {table: EKPO, field: NETWR}
      currency: {table: EKKO, field: WAERS}
      order_date: {table: EKKO, field: BEDAT}
    duplicate_risks: ["EKET and EKBE are 1:N per item - aggregate before joining at item grain."]
  production_order:
    anchor: AFPO
    header: AFKO
    grain: One row per production order item
    model_type: Accumulating snapshot
    business_key: [AUFNR, POSNR]
    tables: [AUFK, AFKO, AFPO, RESB, JEST]
    field_overrides:
      material: {table: AFPO, field: MATNR}
      plant: {table: AFPO, field: PWERK}
    duplicate_risks: ["RESB components are 1:N - model components as a separate fact."]
  serial_number:
    anchor: EQUI
    grain: One row per serialised material instance (MATNR + SERNR)
    model_type: Dimension (SCD2 recommended) + event history fact from OBJK/SER0x
    business_key: [MATNR, SERNR]
    tables: [EQUI, EQBS, EQKT, OBJK, SER01, SER03, JEST, TJ02T]
    field_overrides:
      material: {table: EQUI, field: MATNR}
      plant: {table: EQBS, field: B_WERK}
      storage_location: {table: EQBS, field: B_LAGER}
      batch: {table: EQBS, field: B_CHARGE}
      delivery_number: {table: SER01, field: LIEF_NR}
      delivery_item: {table: SER01, field: POSNR}
      material_document: {table: SER03, field: MBLNR}
    duplicate_risks:
      - "OBJK holds one row per serial per document - joining it changes grain to serial-document event."
      - "JEST has multiple active statuses per object - pivot or filter the statuses you need."

transactions:
  VA03:
    description: Display Sales Order
    type: standard
    program: SAPMV45A
    program_confidence: standard
    business_object: sales_order
    tables: [VBAK, VBAP, VBEP, VBPA, VBFA, KNA1, MAKT]
    notes: "Same screen as VA01/VA02. Pricing conditions are in PRCD_ELEMENTS (S/4) / KONV (ECC)."
    historical: "Sales documents remain in VBAK/VBAP until archived (archiving object SD_VBAK)."
  VA05:
    description: List of Sales Orders
    type: standard
    business_object: sales_order
    tables: [VBAK, VBAP, VBEP, VBPA]
    notes: "Report output; underlying data = sales order tables (index tables VAKPA/VAPMA are used for selection)."
  VL03N:
    description: Display Outbound Delivery
    type: standard
    program: SAPMV50A
    program_confidence: standard
    business_object: delivery
    tables: [LIKP, LIPS, VBPA, VBFA, VEKP, VEPO]
    historical: "Deliveries remain until archived (archiving object RV_LIKP)."
  VL06O:
    description: Outbound Delivery Monitor
    type: standard
    business_object: delivery
    tables: [LIKP, LIPS, VBPA]
  VT03N:
    description: Display Shipment
    type: standard
    program: SAPMV56A
    program_confidence: standard
    business_object: shipment
    tables: [VTTK, VTTP, VTTS, VTSP, LIKP, LIPS]
    notes: "VTSP links stages to deliveries. Freight costs: VI03 -> VFKK/VFKP."
    historical: "Archiving object SD_VTTK."
  VF03:
    description: Display Billing Document
    type: standard
    program: SAPMV60A
    program_confidence: standard
    business_object: billing
    tables: [VBRK, VBRP, VBPA, VBFA]
  ME23N:
    description: Display Purchase Order
    type: standard
    business_object: purchase_order
    tables: [EKKO, EKPO, EKET, EKBE, LFA1]
  MB51:
    description: Material Document List
    type: standard
    program: RM07DOCS
    program_confidence: standard
    business_object: inventory_movement
    tables: [MATDOC, MKPF, MSEG]
    notes: "ECC reads MKPF/MSEG; S/4HANA reads MATDOC (MKPF/MSEG are compatibility views)."
  MMBE:
    description: Stock Overview
    type: standard
    business_object: inventory
    tables: [MARD, MCHB, MARC, MARA]
    notes: "Also shows special stocks (MSKA, MSKU, MSLB) and open sales/transfer requirements."
  MB52:
    description: List of Warehouse Stocks on Hand
    type: standard
    program: RM07MLBS
    program_confidence: standard
    business_object: inventory
    tables: [MARD, MCHB, MARA, MAKT]
  CO03:
    description: Display Production Order
    type: standard
    business_object: production_order
    tables: [AUFK, AFKO, AFPO, AFVC, RESB, JEST]
  IQ09:
    description: Display Material Serial Number (list)
    type: standard
    program_confidence: validate
    program: "List report of the IQ0x family - confirm via SE93 (System > Status) in your system"
    business_object: serial_number
    tables: [EQUI, EQBS, EQKT, OBJK, SER01, SER03, JEST, TJ02T, MAKT]
    notes: "IQ09 lists serial numbers. The serial master is EQUI (MATNR + SERNR), current stock segment in EQBS, statuses in JEST via EQUI-OBJNR (e.g. ESTO = in stock, ECUS = at customer, AVLB = available). Document history (deliveries, goods movements) comes from OBJK + SER01 (deliveries) / SER03 (goods movements)."
    historical: "EQUI is master data (no archiving in normal use); OBJK/SER0x keep the full document history per serial number."
  IQ03:
    description: Display Material Serial Number (single)
    type: standard
    business_object: serial_number
    tables: [EQUI, EQBS, EQKT, OBJK, SER01, SER03, JEST]
