# Shared SAP (ECC + S/4HANA) logistics data dictionary.
# Not loaded as an ERP on its own (abstract: true) - sap_ecc.yaml and sap_s4hana.yaml inherit it.
# Confidence levels: standard | uploaded | inferred | validate
erp:
  id: sap_common
  abstract: true
  family: SAP
  storage: relational
  client_column: MANDT
  date_type: DATS          # SAP DATS = CHAR(8) YYYYMMDD; '00000000' = empty
  source_refs:
    - "SAP data dictionary (SE11 / DD02L, DD03L) - verify in your system"
    - "SAP Help Portal - SD/LE/MM data model documentation"

tables:
  VBAK:
    description: Sales Document Header
    module: SD
    primary_key: [MANDT, VBELN]
    confidence: standard
    role: Header of every SD sales document (orders, quotations, returns, contracts). Filter by VBTYP / AUART for the document category you need.
    fields:
      VBELN: {description: Sales document number, type: CHAR(10)}
      AUART: {description: Sales document type, type: CHAR(4)}
      VBTYP: {description: SD document category (C=order, H=returns, ...), type: CHAR(1)}
      ERDAT: {description: Created on, type: DATS}
      ERZET: {description: Created at time, type: TIMS}
      AEDAT: {description: Last changed on, type: DATS}
      AUDAT: {description: Document date, type: DATS}
      VDATU: {description: Requested delivery date (header), type: DATS}
      VKORG: {description: Sales organization, type: CHAR(4)}
      VTWEG: {description: Distribution channel, type: CHAR(2)}
      SPART: {description: Division, type: CHAR(2)}
      KUNNR: {description: Sold-to party, type: CHAR(10)}
      NETWR: {description: Net value (document currency), type: CURR}
      WAERK: {description: Document currency, type: CUKY}
      BSTNK: {description: Customer purchase order number, type: CHAR(20)}
  VBAP:
    description: Sales Document Item
    module: SD
    primary_key: [MANDT, VBELN, POSNR]
    confidence: standard
    role: Item level of sales documents - material, ordered quantity, plant, rejection reason.
    fields:
      VBELN: {description: Sales document number, type: CHAR(10)}
      POSNR: {description: Sales document item, type: NUMC(6)}
      MATNR: {description: Material number, type: CHAR(40)}
      ARKTX: {description: Item short text, type: CHAR(40)}
      PSTYV: {description: Item category, type: CHAR(4)}
      KWMENG: {description: Cumulative order quantity (sales unit), type: QUAN}
      VRKME: {description: Sales unit, type: UNIT}
      NETWR: {description: Net value of item, type: CURR}
      WAERK: {description: Document currency, type: CUKY}
      WERKS: {description: Plant, type: CHAR(4)}
      LGORT: {description: Storage location, type: CHAR(4)}
      ABGRU: {description: Reason for rejection, type: CHAR(2)}
      CHARG: {description: Batch, type: CHAR(10)}
      ERDAT: {description: Created on, type: DATS}
      AEDAT: {description: Last changed on, type: DATS}
  VBEP:
    description: Sales Document Schedule Line
    module: SD
    primary_key: [MANDT, VBELN, POSNR, ETENR]
    confidence: standard
    role: Schedule lines - requested vs confirmed quantities and dates. Multiple per item.
    fields:
      VBELN: {description: Sales document number, type: CHAR(10)}
      POSNR: {description: Item, type: NUMC(6)}
      ETENR: {description: Schedule line number, type: NUMC(4)}
      EDATU: {description: Schedule line date (requested/confirmed), type: DATS}
      WMENG: {description: Order quantity (sales unit), type: QUAN}
      BMENG: {description: Confirmed quantity, type: QUAN}
      MBDAT: {description: Material availability date, type: DATS}
      WADAT: {description: Goods issue date, type: DATS}
  VBFA:
    description: Sales Document Flow
    module: SD
    primary_key: [MANDT, VBELV, POSNV, VBELN, POSNN, VBTYP_N]
    confidence: standard
    role: Generic predecessor -> successor link between SD documents (order -> delivery -> invoice, delivery -> WMS/material doc). The only generic way to traverse document chains.
    notes: "In S/4HANA the technical primary key of VBFA changed (RUUID); keep VBELV/POSNV/VBELN/POSNN/VBTYP_N as the business key. Filter on VBTYP_V / VBTYP_N to avoid fan-out."
    fields:
      VBELV: {description: Preceding document, type: CHAR(10)}
      POSNV: {description: Preceding item, type: NUMC(6)}
      VBELN: {description: Subsequent document, type: CHAR(10)}
      POSNN: {description: Subsequent item, type: NUMC(6)}
      VBTYP_V: {description: Category of preceding document, type: CHAR(1)}
      VBTYP_N: {description: Category of subsequent document (J=delivery, M=invoice, R=goods movement, 8=shipment), type: CHAR(1)}
      RFMNG: {description: Referenced quantity, type: QUAN}
      ERDAT: {description: Created on, type: DATS}
  VBPA:
    description: Sales Document Partners
    module: SD
    primary_key: [MANDT, VBELN, POSNR, PARVW]
    confidence: standard
    role: Partner functions per document (AG sold-to, WE ship-to, RE bill-to, SP forwarding agent/carrier). POSNR = '000000' holds header partners.
    notes: "Internal partner function codes: AG=sold-to, WE=ship-to, RE=bill-to, RG=payer, SP=forwarding agent. Always filter PARVW and POSNR to avoid fan-out."
    fields:
      VBELN: {description: SD document number (order, delivery or invoice), type: CHAR(10)}
      POSNR: {description: Item ('000000' = header), type: NUMC(6)}
      PARVW: {description: Partner function, type: CHAR(2)}
      KUNNR: {description: Customer, type: CHAR(10)}
      LIFNR: {description: Vendor (e.g. forwarding agent), type: CHAR(10)}
      ADRNR: {description: Address number, type: CHAR(10)}
  KNA1:
    description: Customer Master (General Data)
    module: SD
    primary_key: [MANDT, KUNNR]
    confidence: standard
    role: Customer name, country, address. In S/4HANA customers are Business Partners but KNA1 is still maintained.
    fields:
      KUNNR: {description: Customer number, type: CHAR(10)}
      NAME1: {description: Name 1, type: CHAR(35)}
      LAND1: {description: Country, type: CHAR(3)}
      ORT01: {description: City, type: CHAR(35)}
      PSTLZ: {description: Postal code, type: CHAR(10)}
  LFA1:
    description: Vendor / Supplier Master (General Data)
    module: MM
    primary_key: [MANDT, LIFNR]
    confidence: standard
    role: Suppliers and carriers / forwarding agents.
    fields:
      LIFNR: {description: Vendor number, type: CHAR(10)}
      NAME1: {description: Name, type: CHAR(35)}
      LAND1: {description: Country, type: CHAR(3)}
  TVAGT:
    description: Rejection Reason Texts
    module: SD
    primary_key: [MANDT, SPRAS, ABGRU]
    confidence: standard
    role: Language-dependent text for VBAP-ABGRU.
    fields:
      SPRAS: {description: Language key, type: LANG}
      ABGRU: {description: Reason for rejection, type: CHAR(2)}
      BEZEI: {description: Description, type: CHAR(40)}
  LIKP:
    description: Delivery Header
    module: LE-SHP
    primary_key: [MANDT, VBELN]
    confidence: standard
    role: Outbound/inbound delivery header - shipping point, ship-to, planned and actual goods issue dates.
    fields:
      VBELN: {description: Delivery number, type: CHAR(10)}
      LFART: {description: Delivery type, type: CHAR(4)}
      VBTYP: {description: SD document category (J=outbound delivery, T=returns delivery, 7=inbound), type: CHAR(1)}
      VSTEL: {description: Shipping point, type: CHAR(4)}
      VKORG: {description: Sales organization, type: CHAR(4)}
      KUNNR: {description: Ship-to party, type: CHAR(10)}
      KUNAG: {description: Sold-to party, type: CHAR(10)}
      LFDAT: {description: Planned delivery date, type: DATS}
      WADAT: {description: Planned goods movement date, type: DATS}
      WADAT_IST: {description: Actual goods movement date, type: DATS}
      ROUTE: {description: Route, type: CHAR(6)}
      VSBED: {description: Shipping conditions, type: CHAR(2)}
      LIFNR: {description: Vendor (inbound) , type: CHAR(10)}
      LGNUM: {description: Warehouse number, type: CHAR(3)}
      BTGEW: {description: Total weight, type: QUAN}
      ERDAT: {description: Created on, type: DATS}
      AEDAT: {description: Changed on, type: DATS}
  LIPS:
    description: Delivery Item
    module: LE-SHP
    primary_key: [MANDT, VBELN, POSNR]
    confidence: standard
    role: Delivery item - material, quantity, plant/storage location, batch, and reference (VGBEL/VGPOS) to the preceding sales order or STO item.
    fields:
      VBELN: {description: Delivery number, type: CHAR(10)}
      POSNR: {description: Delivery item, type: NUMC(6)}
      MATNR: {description: Material number, type: CHAR(40)}
      ARKTX: {description: Item short text, type: CHAR(40)}
      LFIMG: {description: Actual quantity delivered (sales unit), type: QUAN}
      VRKME: {description: Sales unit, type: UNIT}
      LGMNG: {description: Delivered quantity in stockkeeping unit, type: QUAN}
      MEINS: {description: Base unit of measure, type: UNIT}
      WERKS: {description: Plant, type: CHAR(4)}
      LGORT: {description: Storage location, type: CHAR(4)}
      CHARG: {description: Batch, type: CHAR(10)}
      VGBEL: {description: Reference document (e.g. sales order), type: CHAR(10)}
      VGPOS: {description: Reference item, type: NUMC(6)}
      VGTYP: {description: Reference document category, type: CHAR(1)}
      PSTYV: {description: Delivery item category, type: CHAR(4)}
      UECHA: {description: Higher-level item (batch split), type: NUMC(6)}
      ERDAT: {description: Created on, type: DATS}
  VTTK:
    description: Shipment Header (LE-TRA)
    module: LE-TRA
    primary_key: [MANDT, TKNUM]
    confidence: standard
    role: Shipment document - carrier, shipping type, overall transport status and planned/actual milestone dates.
    notes: "If your S/4HANA system uses embedded/side-by-side SAP TM, shipments are Freight Orders (/SCMTMS/D_TORROT) instead of VTTK - validate which one is active."
    fields:
      TKNUM: {description: Shipment number, type: CHAR(10)}
      SHTYP: {description: Shipment type, type: CHAR(4)}
      TPLST: {description: Transportation planning point, type: CHAR(4)}
      TDLNR: {description: Service agent / carrier (vendor no.), type: CHAR(10)}
      VSART: {description: Shipping type (transport mode), type: CHAR(2)}
      ROUTE: {description: Route, type: CHAR(6)}
      STTRG: {description: Overall transportation status, type: CHAR(1)}
      EXTI1: {description: External identification 1 (often tracking / BoL), type: CHAR(20)}
      EXTI2: {description: External identification 2, type: CHAR(20)}
      SIGNI: {description: Container ID, type: CHAR(20)}
      DPTBG: {description: Planned date of shipment start, type: DATS}
      DATBG: {description: Actual date of shipment start, type: DATS}
      DPTEN: {description: Planned date of shipment completion, type: DATS}
      DATEN: {description: Actual date of shipment completion, type: DATS}
      DPLBG: {description: Planned loading start date, type: DATS}
      DALBG: {description: Actual loading start date, type: DATS}
      ERDAT: {description: Created on, type: DATS}
      AEDAT: {description: Changed on, type: DATS}
  VTTP:
    description: Shipment Item (shipment -> delivery assignment)
    module: LE-TRA
    primary_key: [MANDT, TKNUM, TPNUM]
    confidence: standard
    role: Bridge between shipments and deliveries. One shipment has many deliveries; a delivery can be in several shipments (e.g. pre-carriage + main leg).
    fields:
      TKNUM: {description: Shipment number, type: CHAR(10)}
      TPNUM: {description: Shipment item, type: NUMC(4)}
      VBELN: {description: Delivery number, type: CHAR(10)}
      TPRFO: {description: Sequence of deliveries in shipment, type: NUMC(4)}
  VTTS:
    description: Shipment Stages (legs)
    module: LE-TRA
    primary_key: [MANDT, TKNUM, TSNUM]
    confidence: standard
    role: Legs / stages of a shipment with departure and destination points.
    fields:
      TKNUM: {description: Shipment number, type: CHAR(10)}
      TSNUM: {description: Stage number, type: NUMC(4)}
      VSTEL: {description: Departure shipping point, type: CHAR(4)}
      KUNNA: {description: Destination customer, type: CHAR(10)}
      VSTEZ: {description: Destination shipping point, type: CHAR(4)}
      WERKA: {description: Departure plant, type: CHAR(4)}
      WERKZ: {description: Destination plant, type: CHAR(4)}
      ROUTE: {description: Route, type: CHAR(6)}
      TDLNR: {description: Carrier for this leg, type: CHAR(10)}
  VFKP:
    description: Shipment Cost Item
    module: LE-TRA
    primary_key: [MANDT, FKNUM, FKPOS]
    confidence: standard
    role: Freight cost items. REBEL holds the reference object (shipment number for shipment-level costs).
    notes: "Join to shipment via REBEL = TKNUM and REFTY (reference type) - validate the reference type used in your configuration. Header is VFKK."
    fields:
      FKNUM: {description: Shipment cost number, type: CHAR(10)}
      FKPOS: {description: Shipment cost item, type: NUMC(6)}
      REBEL: {description: Reference object (e.g. shipment number), type: CHAR(10)}
      REFTY: {description: Reference type, type: CHAR(1)}
      NETWR: {description: Net value, type: CURR}
      WAERS: {description: Currency, type: CUKY}
  VEKP:
    description: Handling Unit Header
    module: LE-HU
    primary_key: [MANDT, VENUM]
    confidence: standard
    role: Handling units (pallets, cartons) packed for deliveries / shipments.
    notes: "VPOBJ + VPOBJKEY identify the packing object (01 = outbound delivery, 04 = shipment)."
    fields:
      VENUM: {description: Internal HU number, type: CHAR(10)}
      EXIDV: {description: External HU identification (SSCC), type: CHAR(20)}
      VPOBJ: {description: Packing object type, type: CHAR(2)}
      VPOBJKEY: {description: Key of packing object (delivery/shipment no.), type: CHAR(22)}
      BRGEW: {description: Gross weight, type: QUAN}
  VEPO:
    description: Handling Unit Item
    module: LE-HU
    primary_key: [MANDT, VENUM, VEPOS]
    confidence: standard
    role: Contents of a handling unit (delivery item reference VBELN/POSNR).
    fields:
      VENUM: {description: Internal HU number, type: CHAR(10)}
      VEPOS: {description: HU item, type: NUMC(6)}
      VBELN: {description: Delivery, type: CHAR(10)}
      POSNR: {description: Delivery item, type: NUMC(6)}
      VEMNG: {description: Packed quantity, type: QUAN}
      MATNR: {description: Material, type: CHAR(40)}
  VBRK:
    description: Billing Document Header
    module: SD-BIL
    primary_key: [MANDT, VBELN]
    confidence: standard
    role: Invoice / credit memo header.
    fields:
      VBELN: {description: Billing document, type: CHAR(10)}
      FKART: {description: Billing type, type: CHAR(4)}
      FKDAT: {description: Billing date, type: DATS}
      KUNAG: {description: Sold-to party, type: CHAR(10)}
      NETWR: {description: Net value, type: CURR}
      WAERK: {description: Currency, type: CUKY}
      FKSTO: {description: Billing document is cancelled, type: CHAR(1)}
  VBRP:
    description: Billing Document Item
    module: SD-BIL
    primary_key: [MANDT, VBELN, POSNR]
    confidence: standard
    role: Invoice items with references to delivery (VGBEL/VGPOS) and sales order (AUBEL/AUPOS).
    fields:
      VBELN: {description: Billing document, type: CHAR(10)}
      POSNR: {description: Billing item, type: NUMC(6)}
      MATNR: {description: Material, type: CHAR(40)}
      FKIMG: {description: Billed quantity, type: QUAN}
      NETWR: {description: Net value, type: CURR}
      VGBEL: {description: Reference document (delivery), type: CHAR(10)}
      VGPOS: {description: Reference item, type: NUMC(6)}
      AUBEL: {description: Sales order, type: CHAR(10)}
      AUPOS: {description: Sales order item, type: NUMC(6)}
  MARA:
    description: Material Master (General)
    module: MM
    primary_key: [MANDT, MATNR]
    confidence: standard
    role: Client-level material master attributes.
    fields:
      MATNR: {description: Material number, type: CHAR(40)}
      MTART: {description: Material type, type: CHAR(4)}
      MATKL: {description: Material group, type: CHAR(9)}
      MEINS: {description: Base unit of measure, type: UNIT}
      BRGEW: {description: Gross weight, type: QUAN}
      ERSDA: {description: Created on, type: DATS}
  MAKT:
    description: Material Descriptions
    module: MM
    primary_key: [MANDT, MATNR, SPRAS]
    confidence: standard
    role: Language-dependent material description - always filter SPRAS to avoid fan-out.
    fields:
      MATNR: {description: Material number, type: CHAR(40)}
      SPRAS: {description: Language key, type: LANG}
      MAKTX: {description: Material description, type: CHAR(40)}
  MARC:
    description: Material Master (Plant)
    module: MM
    primary_key: [MANDT, MATNR, WERKS]
    confidence: standard
    role: Plant-level material data (MRP, procurement, serial number profile SERNP).
    fields:
      MATNR: {description: Material, type: CHAR(40)}
      WERKS: {description: Plant, type: CHAR(4)}
      SERNP: {description: Serial number profile, type: CHAR(4)}
      DISPO: {description: MRP controller, type: CHAR(3)}
  MARD:
    description: Storage Location Stock
    module: MM-IM
    primary_key: [MANDT, MATNR, WERKS, LGORT]
    confidence: standard
    role: Stock quantities per material / plant / storage location.
    fields:
      MATNR: {description: Material, type: CHAR(40)}
      WERKS: {description: Plant, type: CHAR(4)}
      LGORT: {description: Storage location, type: CHAR(4)}
      LABST: {description: Valuated unrestricted-use stock, type: QUAN}
      INSME: {description: Stock in quality inspection, type: QUAN}
      SPEME: {description: Blocked stock, type: QUAN}
      UMLME: {description: Stock in transfer (SLoc to SLoc), type: QUAN}
  MCHB:
    description: Batch Stocks
    module: MM-IM
    primary_key: [MANDT, MATNR, WERKS, LGORT, CHARG]
    confidence: standard
    role: Stock per batch.
    fields:
      MATNR: {description: Material, type: CHAR(40)}
      WERKS: {description: Plant, type: CHAR(4)}
      LGORT: {description: Storage location, type: CHAR(4)}
      CHARG: {description: Batch, type: CHAR(10)}
      CLABS: {description: Unrestricted stock, type: QUAN}
      CINSM: {description: Quality inspection stock, type: QUAN}
      CSPEM: {description: Blocked stock, type: QUAN}
  T001W:
    description: Plants
    module: Basis/Org
    primary_key: [MANDT, WERKS]
    confidence: standard
    role: Plant name and address.
    fields:
      WERKS: {description: Plant, type: CHAR(4)}
      NAME1: {description: Plant name, type: CHAR(30)}
      LAND1: {description: Country, type: CHAR(3)}
  T001L:
    description: Storage Locations
    module: Basis/Org
    primary_key: [MANDT, WERKS, LGORT]
    confidence: standard
    role: Storage location descriptions.
    fields:
      WERKS: {description: Plant, type: CHAR(4)}
      LGORT: {description: Storage location, type: CHAR(4)}
      LGOBE: {description: Description, type: CHAR(16)}
  EKKO:
    description: Purchasing Document Header
    module: MM-PUR
    primary_key: [MANDT, EBELN]
    confidence: standard
    role: Purchase order / STO header.
    fields:
      EBELN: {description: Purchasing document, type: CHAR(10)}
      BSART: {description: Document type (NB standard, UB stock transport), type: CHAR(4)}
      LIFNR: {description: Vendor, type: CHAR(10)}
      RESWK: {description: Supplying plant (STO), type: CHAR(4)}
      BEDAT: {description: Purchasing document date, type: DATS}
      EKORG: {description: Purchasing organization, type: CHAR(4)}
      WAERS: {description: Currency, type: CUKY}
      AEDAT: {description: Created on, type: DATS}
  EKPO:
    description: Purchasing Document Item
    module: MM-PUR
    primary_key: [MANDT, EBELN, EBELP]
    confidence: standard
    role: PO items - material, quantity, receiving plant.
    fields:
      EBELN: {description: Purchasing document, type: CHAR(10)}
      EBELP: {description: Item, type: NUMC(5)}
      MATNR: {description: Material, type: CHAR(40)}
      WERKS: {description: Plant, type: CHAR(4)}
      LGORT: {description: Storage location, type: CHAR(4)}
      MENGE: {description: PO quantity, type: QUAN}
      MEINS: {description: Order unit, type: UNIT}
      NETWR: {description: Net order value, type: CURR}
      LOEKZ: {description: Deletion indicator, type: CHAR(1)}
      ELIKZ: {description: Delivery completed indicator, type: CHAR(1)}
  EKET:
    description: PO Schedule Lines
    module: MM-PUR
    primary_key: [MANDT, EBELN, EBELP, ETENR]
    confidence: standard
    role: Delivery dates and scheduled / received quantities per PO item.
    fields:
      EBELN: {description: Purchasing document, type: CHAR(10)}
      EBELP: {description: Item, type: NUMC(5)}
      ETENR: {description: Schedule line, type: NUMC(4)}
      EINDT: {description: Delivery date, type: DATS}
      MENGE: {description: Scheduled quantity, type: QUAN}
      WEMNG: {description: Quantity received, type: QUAN}
  EKBE:
    description: Purchasing Document History
    module: MM-PUR
    primary_key: [MANDT, EBELN, EBELP, ZEKKN, VGABE, GJAHR, BELNR, BUZEI]
    confidence: standard
    role: GR / IR history per PO item. VGABE = 1 goods receipt, 2 invoice receipt.
    fields:
      EBELN: {description: Purchasing document, type: CHAR(10)}
      EBELP: {description: Item, type: NUMC(5)}
      ZEKKN: {description: Account assignment sequence, type: NUMC(2)}
      VGABE: {description: Transaction type (1=GR, 2=IR), type: CHAR(1)}
      GJAHR: {description: Material doc year, type: NUMC(4)}
      BELNR: {description: Material / invoice document, type: CHAR(10)}
      BUZEI: {description: Item in document, type: NUMC(4)}
      BWART: {description: Movement type, type: CHAR(3)}
      BUDAT: {description: Posting date, type: DATS}
      MENGE: {description: Quantity, type: QUAN}
      SHKZG: {description: Debit/credit (S/H), type: CHAR(1)}
  AUFK:
    description: Order Master Data
    module: PP/CO
    primary_key: [MANDT, AUFNR]
    confidence: standard
    role: Generic order header (production, maintenance, internal orders). Status via OBJNR -> JEST.
    fields:
      AUFNR: {description: Order number, type: CHAR(12)}
      AUART: {description: Order type, type: CHAR(4)}
      WERKS: {description: Plant, type: CHAR(4)}
      OBJNR: {description: Object number (status), type: CHAR(22)}
      ERDAT: {description: Created on, type: DATS}
  AFKO:
    description: Production Order Header (PP)
    module: PP
    primary_key: [MANDT, AUFNR]
    confidence: standard
    role: Production order dates and quantities.
    fields:
      AUFNR: {description: Order number, type: CHAR(12)}
      GAMNG: {description: Total order quantity, type: QUAN}
      GSTRP: {description: Basic start date, type: DATS}
      GLTRP: {description: Basic finish date, type: DATS}
      RSNUM: {description: Reservation number (components), type: NUMC(10)}
  AFPO:
    description: Production Order Item
    module: PP
    primary_key: [MANDT, AUFNR, POSNR]
    confidence: standard
    role: Produced material, planned and delivered (GR) quantity.
    fields:
      AUFNR: {description: Order number, type: CHAR(12)}
      POSNR: {description: Order item, type: NUMC(4)}
      MATNR: {description: Material, type: CHAR(40)}
      PSMNG: {description: Order item quantity, type: QUAN}
      WEMNG: {description: Quantity of goods received, type: QUAN}
      PWERK: {description: Planning plant, type: CHAR(4)}
  RESB:
    description: Reservation / Dependent Requirements
    module: PP/MM
    primary_key: [MANDT, RSNUM, RSPOS, RSART]
    confidence: standard
    role: Component requirements of production orders (BDMNG required, ENMNG withdrawn).
    fields:
      RSNUM: {description: Reservation number, type: NUMC(10)}
      RSPOS: {description: Reservation item, type: NUMC(4)}
      RSART: {description: Record type, type: CHAR(1)}
      AUFNR: {description: Order number, type: CHAR(12)}
      MATNR: {description: Component material, type: CHAR(40)}
      BDMNG: {description: Requirement quantity, type: QUAN}
      ENMNG: {description: Quantity withdrawn, type: QUAN}
  EQUI:
    description: Equipment Master (serialised material instances)
    module: PM/LO-MD-SN
    primary_key: [MANDT, EQUNR]
    confidence: standard
    role: Each material serial number is stored as an equipment record (MATNR + SERNR is the business key).
    fields:
      EQUNR: {description: Equipment number, type: CHAR(18)}
      MATNR: {description: Material, type: CHAR(40)}
      SERNR: {description: Serial number, type: CHAR(18)}
      EQTYP: {description: Equipment category, type: CHAR(1)}
      OBJNR: {description: Object number (status), type: CHAR(22)}
      ERDAT: {description: Created on, type: DATS}
      AEDAT: {description: Changed on, type: DATS}
  EQBS:
    description: Serial Number Stock Segment
    module: LO-MD-SN
    primary_key: [MANDT, EQUNR]
    confidence: standard
    role: Current stock information of a serial number - plant, storage location, batch, special stock, customer.
    fields:
      EQUNR: {description: Equipment number, type: CHAR(18)}
      B_WERK: {description: Plant, type: CHAR(4)}
      B_LAGER: {description: Storage location, type: CHAR(4)}
      B_CHARGE: {description: Batch, type: CHAR(10)}
      SOBKZ: {description: Special stock indicator, type: CHAR(1)}
      KUNNR: {description: Customer (special stock), type: CHAR(10)}
      LBBSA: {description: Stock type, type: CHAR(2)}
  EQKT:
    description: Equipment Short Texts
    module: PM
    primary_key: [MANDT, EQUNR, SPRAS]
    confidence: standard
    role: Description of equipment / serial number record.
    fields:
      EQUNR: {description: Equipment number, type: CHAR(18)}
      SPRAS: {description: Language, type: LANG}
      EQKTX: {description: Description, type: CHAR(40)}
  OBJK:
    description: Plant Maintenance Object List (serial numbers in documents)
    module: LO-MD-SN
    primary_key: [MANDT, OBKNR, OBZAE]
    confidence: standard
    role: Serial numbers assigned to an object list; linked to documents via SER01/SER02/SER03.
    fields:
      OBKNR: {description: Object list number, type: NUMC(10)}
      OBZAE: {description: Object list counter, type: NUMC(6)}
      EQUNR: {description: Equipment number, type: CHAR(18)}
      SERNR: {description: Serial number, type: CHAR(18)}
      MATNR: {description: Material, type: CHAR(40)}
      TASER: {description: Header table (SER01/SER02/SER03...), type: CHAR(5)}
  SER01:
    description: Document Header for Serial Numbers in Delivery
    module: LO-MD-SN
    primary_key: [MANDT, OBKNR]
    confidence: standard
    role: Links an object list (OBKNR) to a delivery item (LIEF_NR / POSNR).
    fields:
      OBKNR: {description: Object list number, type: NUMC(10)}
      LIEF_NR: {description: Delivery, type: CHAR(10)}
      POSNR: {description: Delivery item, type: NUMC(6)}
      VBTYP: {description: SD document category, type: CHAR(1)}
      DATUM: {description: Date, type: DATS}
  SER03:
    description: Document Header for Serial Numbers in Goods Movements
    module: LO-MD-SN
    primary_key: [MANDT, OBKNR]
    confidence: standard
    role: Links an object list to a material document line (MBLNR / MJAHR / ZEILE).
    fields:
      OBKNR: {description: Object list number, type: NUMC(10)}
      MBLNR: {description: Material document, type: CHAR(10)}
      MJAHR: {description: Material document year, type: NUMC(4)}
      ZEILE: {description: Material document item, type: NUMC(4)}
      BWART: {description: Movement type, type: CHAR(3)}
      WERK: {description: Plant, type: CHAR(4)}
  JEST:
    description: Individual Object Status
    module: Basis/Status
    primary_key: [MANDT, OBJNR, STAT]
    confidence: standard
    role: System/user statuses for objects with OBJNR (orders, equipment). INACT = 'X' means status inactive.
    fields:
      OBJNR: {description: Object number, type: CHAR(22)}
      STAT: {description: Status (e.g. I0002 REL, I0045 TECO), type: CHAR(5)}
      INACT: {description: Status inactive flag, type: CHAR(1)}
  TJ02T:
    description: System Status Texts
    module: Basis/Status
    primary_key: [MANDT, ISTAT, SPRAS]
    confidence: standard
    role: Text for JEST-STAT system statuses.
    fields:
      ISTAT: {description: System status, type: CHAR(5)}
      SPRAS: {description: Language, type: LANG}
      TXT04: {description: Status short text (e.g. ESTO, AVLB, ECUS), type: CHAR(4)}
      TXT30: {description: Status description, type: CHAR(30)}

virtual_tables:
  SO_DELIVERED_QTY:
    description: Delivered quantity aggregated per sales order item (from delivery items referencing the order)
    confidence: inferred
    primary_key: [MANDT, VGBEL, VGPOS]
    role: Pre-aggregation that prevents fan-out when you need delivered/open quantity at sales-order-item grain.
    notes: "LFIMG is in the delivery sales unit; assumes it equals VBAP-VRKME. Excludes nothing by default - add a filter on goods issue status if only shipped quantity is wanted."
    sql: |
      SELECT MANDT, VGBEL, VGPOS, SUM(LFIMG) AS DELIVERED_QTY
      FROM {{LIPS}}
      WHERE VGBEL IS NOT NULL
      GROUP BY MANDT, VGBEL, VGPOS
    fields:
      VGBEL: {description: Sales order, type: CHAR(10)}
      VGPOS: {description: Sales order item, type: NUMC(6)}
      DELIVERED_QTY: {description: Sum of delivered quantity, type: QUAN}
  SO_CONFIRMED_QTY:
    description: Confirmed quantity and first requested date per sales order item (from schedule lines)
    confidence: inferred
    primary_key: [MANDT, VBELN, POSNR]
    role: Aggregates VBEP to item grain - avoids multiplying VBAP rows by schedule lines.
    sql: |
      SELECT MANDT, VBELN, POSNR, SUM(BMENG) AS CONFIRMED_QTY, MIN(EDATU) AS FIRST_SCHEDULE_DATE
      FROM {{VBEP}}
      GROUP BY MANDT, VBELN, POSNR
    fields:
      VBELN: {description: Sales order, type: CHAR(10)}
      POSNR: {description: Item, type: NUMC(6)}
      CONFIRMED_QTY: {description: Sum of confirmed quantity, type: QUAN}
      FIRST_SCHEDULE_DATE: {description: First schedule line date, type: DATS}

relationships:
  - {from: VBAK, to: VBAP, on: [[VBELN, VBELN]], cardinality: "1:N", confidence: standard}
  - {from: VBAP, to: VBEP, on: [[VBELN, VBELN], [POSNR, POSNR]], cardinality: "1:N", confidence: standard}
  - {from: VBAP, to: SO_CONFIRMED_QTY, on: [[VBELN, VBELN], [POSNR, POSNR]], cardinality: "1:1", confidence: inferred}
  - {from: VBAP, to: SO_DELIVERED_QTY, on: [[VBELN, VGBEL], [POSNR, VGPOS]], cardinality: "1:1", confidence: inferred}
  - {from: VBAK, to: KNA1, on: [[KUNNR, KUNNR]], cardinality: "N:1", confidence: standard, label: sold-to}
  - {from: VBAP, to: TVAGT, on: [[ABGRU, ABGRU]], cardinality: "N:1", confidence: standard, filter: "{TVAGT}.SPRAS = 'E'"}
  - {from: VBAP, to: MAKT, on: [[MATNR, MATNR]], cardinality: "N:1", confidence: standard, filter: "{MAKT}.SPRAS = 'E'"}
  - {from: VBAP, to: MARA, on: [[MATNR, MATNR]], cardinality: "N:1", confidence: standard}
  - {from: VBAP, to: T001W, on: [[WERKS, WERKS]], cardinality: "N:1", confidence: standard}
  - {from: VBAK, to: VBPA, on: [[VBELN, VBELN]], cardinality: "1:1", confidence: standard, filter: "{VBPA}.POSNR = '000000' AND {VBPA}.PARVW = 'WE'", label: "ship-to partner (header)"}
  # order -> delivery: LIPS references the order item directly (VGBEL/VGPOS). VBFA is the generic alternative.
  - {from: VBAP, to: LIPS, on: [[VBELN, VGBEL], [POSNR, VGPOS]], cardinality: "1:N", confidence: standard, label: "reference document (LIPS-VGBEL/VGPOS)"}
  - {from: LIKP, to: LIPS, on: [[VBELN, VBELN]], cardinality: "1:N", confidence: standard}
  - {from: LIKP, to: KNA1, on: [[KUNNR, KUNNR]], cardinality: "N:1", confidence: standard, label: ship-to}
  - {from: LIPS, to: MAKT, on: [[MATNR, MATNR]], cardinality: "N:1", confidence: standard, filter: "{MAKT}.SPRAS = 'E'"}
  - {from: LIPS, to: MARA, on: [[MATNR, MATNR]], cardinality: "N:1", confidence: standard}
  - {from: LIPS, to: T001W, on: [[WERKS, WERKS]], cardinality: "N:1", confidence: standard}
  - {from: LIPS, to: T001L, on: [[WERKS, WERKS], [LGORT, LGORT]], cardinality: "N:1", confidence: standard}
  - {from: VBAP, to: VBFA, on: [[VBELN, VBELV], [POSNR, POSNV]], cardinality: "1:N", confidence: standard, filter: "{VBFA}.VBTYP_N = 'J'", label: "document flow order -> delivery"}
  # delivery -> shipment (bridge VTTP)
  - {from: LIKP, to: VTTP, on: [[VBELN, VBELN]], cardinality: "1:N", confidence: standard, label: "delivery assigned to shipment(s)"}
  - {from: VTTK, to: VTTP, on: [[TKNUM, TKNUM]], cardinality: "1:N", confidence: standard}
  - {from: VTTK, to: VTTS, on: [[TKNUM, TKNUM]], cardinality: "1:N", confidence: standard}
  - {from: VTTK, to: LFA1, on: [[TDLNR, LIFNR]], cardinality: "N:1", confidence: standard, label: carrier}
  - {from: VTTK, to: VFKP, on: [[TKNUM, REBEL]], cardinality: "1:N", confidence: validate, label: "freight cost by reference object"}
  - {from: LIKP, to: VEKP, on: [[VBELN, VPOBJKEY]], cardinality: "1:N", confidence: inferred, filter: "{VEKP}.VPOBJ = '01'", label: "HUs packed on delivery"}
  - {from: VEKP, to: VEPO, on: [[VENUM, VENUM]], cardinality: "1:N", confidence: standard}
  # billing
  - {from: LIPS, to: VBRP, on: [[VBELN, VGBEL], [POSNR, VGPOS]], cardinality: "1:N", confidence: standard, label: "invoice item references delivery item"}
  - {from: VBRK, to: VBRP, on: [[VBELN, VBELN]], cardinality: "1:N", confidence: standard}
  # inventory
  - {from: MARD, to: MARA, on: [[MATNR, MATNR]], cardinality: "N:1", confidence: standard}
  - {from: MARD, to: MAKT, on: [[MATNR, MATNR]], cardinality: "N:1", confidence: standard, filter: "{MAKT}.SPRAS = 'E'"}
  - {from: MARD, to: T001W, on: [[WERKS, WERKS]], cardinality: "N:1", confidence: standard}
  - {from: MARD, to: T001L, on: [[WERKS, WERKS], [LGORT, LGORT]], cardinality: "N:1", confidence: standard}
  - {from: MARD, to: MCHB, on: [[MATNR, MATNR], [WERKS, WERKS], [LGORT, LGORT]], cardinality: "1:N", confidence: standard}
  - {from: MARC, to: MARD, on: [[MATNR, MATNR], [WERKS, WERKS]], cardinality: "1:N", confidence: standard}
  # purchasing
  - {from: EKKO, to: EKPO, on: [[EBELN, EBELN]], cardinality: "1:N", confidence: standard}
  - {from: EKPO, to: EKET, on: [[EBELN, EBELN], [EBELP, EBELP]], cardinality: "1:N", confidence: standard}
  - {from: EKPO, to: EKBE, on: [[EBELN, EBELN], [EBELP, EBELP]], cardinality: "1:N", confidence: standard, filter: "{EKBE}.VGABE = '1'", label: goods receipts}
  - {from: EKKO, to: LFA1, on: [[LIFNR, LIFNR]], cardinality: "N:1", confidence: standard}
