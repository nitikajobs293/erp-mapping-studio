  - {from: AFKO, to: RESB, on: [[RSNUM, RSNUM]], cardinality: "1:N", confidence: standard}
  - {from: AFPO, to: MAKT, on: [[MATNR, MATNR]], cardinality: "N:1", confidence: standard, filter: "{MAKT}.SPRAS = 'E'"}
