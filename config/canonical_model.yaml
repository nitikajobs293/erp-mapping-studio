  shipment_number:      {label: Shipment Number, target: SHIPMENT_NUMBER, type: VARCHAR, objects: [shipment], synonyms: [shipment, shipment number, shipment no, shipment id, load number, load id, trip, freight order]}
  shipment_type:        {label: Shipment Type, target: SHIPMENT_TYPE, type: VARCHAR, objects: [shipment], synonyms: [shipment type]}
