  movement_date:        {label: Posting / Transaction Date, target: POSTING_DATE, type: DATE, objects: [inventory_movement], synonyms: [posting date, movement date, transaction date, gl date]}
  movement_quantity:    {label: Movement Quantity, target: MOVEMENT_QTY, type: "NUMBER(18,3)", objects: [inventory_movement], synonyms: [movement quantity, transaction quantity, quantity moved]}
