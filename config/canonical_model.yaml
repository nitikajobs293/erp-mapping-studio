  shipment_status:      {label: Shipment Status, target: SHIPMENT_STATUS, type: VARCHAR, objects: [shipment], synonyms: [shipment status, transport status, load status, trip status]}
  departure_date:       {label: Departure Date, target: ACTUAL_DEPARTURE_DATE, type: DATE, objects: [shipment], synonyms: [departure date, actual departure, shipment start, dispatched date]}
  arrival_date:         {label: Arrival Date, target: ACTUAL_ARRIVAL_DATE, type: DATE, objects: [shipment], synonyms: [arrival date, actual arrival, shipment end, shipment completion date]}
  actual_delivery_date: {label: Actual Delivery Date, target: ACTUAL_DELIVERY_DATE, type: DATE, objects: [shipment, sales_order], synonyms: [actual delivery date, proof of delivery date, pod date, delivered date]}
  tracking_number:      {label: Tracking Number, target: TRACKING_NUMBER, type: VARCHAR, objects: [shipment], synonyms: [tracking number, tracking no, waybill, bill of lading, bol, pro number, airway bill, awb, external id]}
  route:                {label: Route, target: ROUTE, type: VARCHAR, objects: [shipment, delivery], synonyms: [route, routing]}
  origin:               {label: Origin, target: ORIGIN, type: VARCHAR, objects: [shipment], synonyms: [origin, ship from, departure point, source location]}
  destination:          {label: Destination, target: DESTINATION, type: VARCHAR, objects: [shipment], synonyms: [destination, ship to location, destination point]}
  freight_cost:         {label: Freight Cost, target: FREIGHT_COST, type: "NUMBER(18,2)", objects: [shipment], synonyms: [freight cost, shipment cost, freight charges, transport cost, freight amount]}
  handling_unit:        {label: Handling Unit / LPN, target: HANDLING_UNIT, type: VARCHAR, objects: [delivery, shipment], synonyms: [handling unit, hu, lpn, license plate, pallet, carton, sscc]}
  # ---------------- Billing ----------------
  invoice_number:       {label: Invoice Number, target: INVOICE_NUMBER, type: VARCHAR, objects: [billing], synonyms: [invoice, invoice number, billing document, bill number]}
  invoice_date:         {label: Invoice Date, target: INVOICE_DATE, type: DATE, objects: [billing], synonyms: [invoice date, billing date]}
  # ---------------- Inventory ----------------
  batch:                {label: Batch / Lot, target: BATCH, type: VARCHAR, objects: [inventory, inventory_movement, delivery], synonyms: [batch, lot, lot number, batch number]}
