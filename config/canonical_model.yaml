  production_completed_qty: {label: Completed / Delivered Quantity, target: PRODUCTION_COMPLETED_QTY, type: "NUMBER(18,3)", objects: [production_order], synonyms: [completed quantity, yield, delivered quantity production, production completion]}
  component_quantity:   {label: Component Requirement Qty, target: COMPONENT_REQUIRED_QTY, type: "NUMBER(18,3)", objects: [production_order], synonyms: [component quantity, material consumption, requirement quantity, consumed quantity]}
