  stock_unrestricted:   {label: Unrestricted / On-hand Stock, target: UNRESTRICTED_QTY, type: "NUMBER(18,3)", objects: [inventory], synonyms: [stock quantity, on hand, on hand quantity, unrestricted stock, available stock, qty on hand]}
